<script>
(function(){
  const trigger=document.getElementById('profileTrigger');
  const menu=document.getElementById('profileMenu');
  function setMenu(open){menu.classList.toggle('open',open);trigger.setAttribute('aria-expanded',String(open));}
  trigger.addEventListener('click',function(e){e.stopPropagation();setMenu(!menu.classList.contains('open'));});
  menu.addEventListener('click',function(e){e.stopPropagation();});
  document.addEventListener('click',function(){setMenu(false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')setMenu(false);});
  function applyTelegramUser(user){
    if(!user)return;
    const fullName=[user.first_name,user.last_name].filter(Boolean).join(' ').trim();
    const name=fullName|| (user.username?'@'+user.username:'Пользователь');
    const username=user.username?'@'+user.username:'Аккаунт Telegram';
    document.getElementById('headerName').textContent=name;
    document.getElementById('headerHint').textContent=user.username?'@'+user.username:'Ваш профиль';
    document.getElementById('menuName').textContent=name;
    document.getElementById('menuUsername').textContent=username;
    const initials=(user.first_name||user.username||'TG').trim().slice(0,1).toUpperCase();
    ['headerAvatar','menuAvatar'].forEach(function(id){
      const el=document.getElementById(id);
      el.textContent=initials;
      if(user.photo_url){
        const img=document.createElement('img');
        img.src=user.photo_url;
        img.alt='';
        img.referrerPolicy='no-referrer';
        img.onerror=function(){img.remove();el.textContent=initials;};
        el.replaceChildren(img);
      }
    });
  }
  try{
    const tg=window.Telegram&&window.Telegram.WebApp;
    if(tg){
      tg.ready();
      if(typeof tg.expand==='function')tg.expand();
      applyTelegramUser(tg.initDataUnsafe&&tg.initDataUnsafe.user);
    }
  }catch(e){}
  function setupOnlineCounter(elementId,initialValue,minValue,maxValue){
    const counter=document.getElementById(elementId);
    if(!counter)return;
    const storageKey='ripiup.online.'+elementId;
    const historyWindowMs=5*60*1000;
    const now=Date.now();
    let saved=null;
    try{saved=JSON.parse(localStorage.getItem(storageKey)||'null');}catch(e){}
    let currentOnline=saved&&Number.isFinite(saved.value)&&saved.value>=minValue&&saved.value<=maxValue?saved.value:initialValue;
    let history=saved&&Array.isArray(saved.history)?saved.history.filter(function(item){return item&&Number.isFinite(item.time)&&Number.isFinite(item.value)&&item.time>=now-historyWindowMs&&item.value>=minValue&&item.value<=maxValue;}):[];
    history.push({time:now,value:currentOnline});
    function persist(){
      const cutoff=Date.now()-historyWindowMs;
      history=history.filter(function(item){return item.time>=cutoff;});
      try{localStorage.setItem(storageKey,JSON.stringify({value:currentOnline,updatedAt:Date.now(),history:history}));}catch(e){}
    }
    function render(){
      counter.textContent=String(currentOnline);

  // Rocket plays continuously. Other animated WebP cards run in two independent,
  // sequential queues. Each queue waits for a frame to load before switching cards.
  function createSequentialAnimationQueue(images, delay){
    images=images.filter(Boolean);
    let active=null;
    let activeUntil=0;
    let nextIndex=0;
    let timer=null;

    function freezeFrame(image){
      if(!image || !image.complete || !image.naturalWidth || !image.naturalHeight) return false;
      try{
        const canvas=document.createElement('canvas');
        canvas.width=image.naturalWidth;
        canvas.height=image.naturalHeight;
        const context=canvas.getContext('2d');
        if(!context) return false;
        context.drawImage(image,0,0,canvas.width,canvas.height);
        const still=canvas.toDataURL('image/png');
        image.dataset.frozenSrc=still;
        image.src=still;
        return true;
      }catch(error){
        // Keep the current source and retry; never blank the image on capture errors.
        return false;
      }
    }

    images.forEach(image=>{
      image.dataset.animatedSrc=image.getAttribute('src')||'';
      image.dataset.cardVisible='true';
      image.addEventListener('load',()=>{
        // If an animation finished loading while it wasn't selected, freeze it
        // once, but don't touch the currently active animation.
        if(image!==active && !image.dataset.frozenSrc) freezeFrame(image);
      });
    });

    let observer=null;
    if('IntersectionObserver' in window){
      observer=new IntersectionObserver(entries=>{
        entries.forEach(entry=>{
          const image=entry.target;
          image.dataset.cardVisible=entry.isIntersecting?'true':'false';
          if(!entry.isIntersecting && image===active){
            // Only release the slot after a still frame was captured successfully.
            if(freezeFrame(image)){ active=null; activeUntil=0; }
          }
        });
        schedule(0);
      },{rootMargin:'80px 0px',threshold:0.01});
      images.forEach(image=>observer.observe(image));
    }

    function schedule(wait){
      if(timer!==null) window.clearTimeout(timer);
      timer=window.setTimeout(tick,wait);
    }

    function tick(){
      timer=null;
      if(active){
        if(!active.complete || !active.naturalWidth){
          schedule(150);
          return;
        }
        if(activeUntil && Date.now()<activeUntil){
          schedule(activeUntil-Date.now());
          return;
        }
        if(!freezeFrame(active)){
          // Image may still be loading; retain ownership and retry instead of
          // letting two WebP animations run or making the active image disappear.
          schedule(150);
          return;
        }
        active=null;
        activeUntil=0;
      }
      for(let i=0;i<images.length;i++){
        const index=(nextIndex+i)%images.length;
        const image=images[index];
        if(image.dataset.cardVisible!=='true' || !image.dataset.animatedSrc) continue;
        nextIndex=(index+1)%images.length;
        active=image;
        activeUntil=0;
        // Assign directly: removing src first causes a visible blank/flicker.
        if(image.getAttribute('src')!==image.dataset.animatedSrc){
          image.src=image.dataset.animatedSrc;
        }
        // Wait for the selected image to finish loading, then give it a full turn.
        if(image.complete && image.naturalWidth){
          activeUntil=Date.now()+delay;
          schedule(delay);
        }else{
          const onLoaded=()=>{
            image.removeEventListener('load',onLoaded);
            image.removeEventListener('error',onError);
            if(active===image){ activeUntil=Date.now()+delay; schedule(delay); }
          };
          const onError=()=>{
            image.removeEventListener('load',onLoaded);
            image.removeEventListener('error',onError);
            if(active===image){
              active=null;
              activeUntil=0;
              schedule(150);
            }
          };
          image.addEventListener('load',onLoaded);
          image.addEventListener('error',onError);
          schedule(150);
        }
        return;
      }
      // Nothing visible right now; check again soon without advancing the turn.
      schedule(500);
    }

    // Let the initial WebP frame render before freezing inactive cards.
    images.forEach(image=>{
      if(image.complete && image.naturalWidth) freezeFrame(image);
    });
    schedule(100);
  }

  function animateMultiplier(card){

    function frame(now){
      const elapsed=(now-started)%(runDuration+resetDuration);

      if(elapsed<runDuration){
        const progress=elapsed/runDuration;
        value=startValue+(target-startValue)*Math.pow(progress,1.18);
      }else{
        const resetProgress=(elapsed-runDuration)/resetDuration;
        const eased=resetProgress*resetProgress*(3-2*resetProgress);
