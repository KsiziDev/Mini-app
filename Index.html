<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>RipiUp</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#07111f;--text:#f8f7ff;--muted:#91a4bd;--purple:#63a8ff;--safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px);--tg-top:var(--tg-content-safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{min-height:100vh;min-height:100dvh;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{min-height:100vh;min-height:100dvh;padding:0 10px calc(110px + var(--safe-bottom))}
.brand-logo-wrap{display:flex;justify-content:center;align-items:center;width:100%;height:98px;padding:calc(var(--safe-top) + var(--tg-top) + 14px) 0 0;line-height:0;pointer-events:none;overflow:visible}.brand-logo{display:block;flex:0 0 auto;width:min(184px,52vw);height:184px;margin:-48px 0;transform:translateY(-7px);object-fit:contain;object-position:center;filter:drop-shadow(0 4px 14px rgba(0,0,0,.2))}.top-header{position:relative;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 7px 12px}
.profile-area{position:relative;display:flex;align-items:center;gap:9px;min-width:0;order:1;flex:0 1 auto;margin-left:0}
.profile-trigger{order:1;display:grid;grid-template-columns:42px minmax(0,auto) 12px;grid-template-rows:auto auto;align-items:center;column-gap:8px;row-gap:3px;min-width:0;padding:0;border:0;background:transparent;color:var(--text);text-align:left;cursor:pointer}
.profile-trigger .avatar{grid-column:1;grid-row:1 / span 2;width:42px;height:42px}
.profile-trigger .avatar{position:relative;overflow:visible}
.profile-trigger .avatar::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#22c55e;border:2px solid var(--panel, #151a22);box-shadow:0 0 0 0 rgba(34,197,94,.55);animation:onlinePulse 1.8s ease-out infinite;pointer-events:none}
@keyframes onlinePulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55);transform:scale(.96)}65%{box-shadow:0 0 0 5px rgba(34,197,94,0);transform:scale(1)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0);transform:scale(.96)}}
@media(prefers-reduced-motion:reduce){.profile-trigger .avatar::after{animation:none}}
.profile-trigger .profile-copy{grid-column:2;grid-row:1 / span 2;align-self:center}
.profile-trigger .chevron{grid-column:3;grid-row:1 / span 2;align-self:center}
@media(max-width:370px){.profile-trigger{grid-template-columns:38px minmax(0,auto) 12px;column-gap:6px}.profile-trigger .avatar{width:38px;height:38px}}
.avatar{width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,#318bff,#1558a8);border:1px solid rgba(255,255,255,.42);box-shadow:0 3px 12px #0004,inset 0 1px 0 #ffffff55;color:#fff;font-size:16px;font-weight:800}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.profile-copy{display:flex;flex-direction:column;gap:3px;min-width:0}
.profile-name{max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:750;letter-spacing:.05px}
.profile-hint{font-size:10px;color:var(--muted)}
.chevron{width:12px;height:12px;flex:0 0 12px;stroke:#8bbcff;fill:none;stroke-width:2;transition:transform .2s}
.profile-trigger[aria-expanded="true"] .chevron{transform:rotate(180deg)}
.deposit-button{order:0;flex:0 0 auto;display:flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:10px 12px;background:#1677f8;box-shadow:none;color:#fff;font-family:inherit;font-size:11px;font-weight:800;line-height:1;white-space:nowrap;cursor:pointer}
.deposit-button svg{width:19px;height:19px;flex:0 0 19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.balance-area{order:0;margin-left:0;display:flex;align-items:center;gap:7px;min-width:0;padding:9px 10px;border:1px solid #ffffff17;border-radius:15px;background:linear-gradient(145deg,#ffffff0d,#ffffff04);box-shadow:inset 0 1px 0 #ffffff0d}
.star-token{position:relative;isolation:isolate;overflow:hidden;width:29px;height:29px;flex:0 0 29px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(145deg,#7fc4ff,#2479ee);box-shadow:0 2px 8px #1677f822,inset 0 1px 0 #ffffff55}
.star-token:after{content:"";position:absolute;z-index:0;inset:-45% -70%;pointer-events:none;background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,0) 44%,rgba(255,255,255,.82) 50%,rgba(210,237,255,.28) 54%,transparent 62%);transform:translateX(-75%) rotate(8deg);animation:starSheen 2.8s ease-in-out infinite alternate}
.star-token svg{position:relative;z-index:1;filter:drop-shadow(0 0 2px rgba(255,255,255,.3))}
@keyframes starSheen{0%{transform:translateX(-75%) rotate(8deg);opacity:.22}45%{opacity:.8}100%{transform:translateX(75%) rotate(8deg);opacity:.28}}
.star-token svg{width:19px;height:19px;fill:#fff8df;stroke:#f2f8ff;stroke-width:1.2;stroke-linejoin:round}
.balance-copy{display:flex;flex-direction:column;gap:3px;min-width:0}
.balance-label{font-size:9px;color:var(--muted);white-space:nowrap}
.balance-value{font-size:16px;font-weight:850;line-height:1.05;letter-spacing:-.3px}
.balance-unit{font-size:10px;color:#8fc5ff;font-weight:650;margin-left:3px}
.profile-menu{position:absolute;top:calc(100% + 10px);left:0;width:222px;padding:8px;border:1px solid rgba(255,255,255,.2);border-radius:20px;background:rgba(12,29,51,.97);box-shadow:0 14px 34px #0006,inset 0 1px 0 #ffffff12;backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);opacity:0;visibility:hidden;transform:translateY(-5px) scale(.98);transform-origin:top left;transition:opacity .18s,transform .18s,visibility .18s}
.profile-menu.open{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
.menu-user{display:flex;align-items:center;gap:9px;padding:8px 8px 12px;border-bottom:1px solid #ffffff12;margin-bottom:5px}
.menu-user .avatar{width:34px;height:34px;flex-basis:34px;font-size:13px}
.menu-user-copy{min-width:0;display:flex;flex-direction:column;gap:3px}
.menu-user-name{font-size:12px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-user-caption{font-size:10px;color:var(--muted)}
.menu-item{width:100%;display:flex;align-items:center;gap:10px;padding:11px 10px;border:0;border-radius:12px;background:transparent;color:#f2f7ff;text-align:left;font-family:inherit;font-size:12px;font-weight:650;line-height:1.2;cursor:default}
.menu-item svg{width:18px;height:18px;flex:0 0 18px;stroke:#7db8ff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.menu-item .soon{margin-left:auto;font-size:9px;color:#9c96b8;font-weight:550}
.menu-item:hover{background:#ffffff0a}
.bottom-nav{position:fixed;z-index:30;bottom:calc(12px + var(--safe-bottom));left:50%;transform:translateX(-50%);width:min(490px,calc(100% - 28px));padding:8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;border-radius:22px;isolation:isolate;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.035) 42%,rgba(65,145,255,.025));border:1px solid rgba(255,255,255,.24);box-shadow:0 10px 28px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%)}
.bottom-nav:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.055),transparent 30%,transparent 70%,rgba(65,145,255,.035));mask-image:linear-gradient(#000,transparent 65%)}
.nav-item{position:relative;appearance:none;border:1px solid transparent;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:59px;padding:7px 2px;border-radius:15px;font-family:inherit;font-size:10px;font-weight:650;line-height:1.2;cursor:pointer;transition:color .22s ease,background .22s ease,transform .18s ease,border-color .22s ease;outline:none}
.nav-item:focus-visible{box-shadow:0 0 0 2px rgba(91,169,255,.85)}
.nav-item:active{transform:scale(.94)}
.nav-item.active{color:#fff;background:rgba(38,119,220,.18);border-color:rgba(98,169,255,.24);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.nav-icon{width:26px;height:26px;display:grid;place-items:center}
.nav-icon svg{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;transition:filter .22s ease,transform .22s ease}
.nav-item.active .nav-icon svg{filter:none;stroke:#78b7ff;transform:translateY(-1px)}
.nav-item span:last-child{white-space:nowrap}
@media(max-width:370px){main{padding-left:10px;padding-right:10px}.top-header{gap:6px}.profile-area{gap:6px}.profile-name{max-width:74px}.avatar{width:38px;height:38px;flex-basis:38px}.deposit-button{padding:9px 8px;font-size:10px}.deposit-button svg{width:18px;height:18px;flex-basis:18px}.balance-area{padding:8px 7px;gap:5px}.star-token{width:25px;height:25px;flex-basis:25px}.balance-label{font-size:8px}.balance-value{font-size:15px}}
.multiplier-card{position:absolute;z-index:1;display:flex;align-items:center;justify-content:center;min-width:70px;padding:9px 11px;border:1px solid rgba(220,255,224,.42);border-radius:12px;background:linear-gradient(145deg,#22c55e,#078b46);box-shadow:0 5px 13px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.28);color:#fff;font-size:16px;font-weight:900;letter-spacing:-.35px;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.22);font-variant-numeric:tabular-nums;white-space:nowrap;will-change:transform,background-color;pointer-events:none}.multiplier-card.one{left:4%;right:auto;top:44px;bottom:auto;transform:rotate(-8deg)}.multiplier-card.two{left:43%;right:auto;top:20px;bottom:auto;transform:rotate(6deg)}.multiplier-card.three{left:auto;right:5%;top:78px;bottom:auto;z-index:4;transform:rotate(-5deg) scale(.88);min-width:84px}.multiplier-card.gold{background:linear-gradient(145deg,#ffd76a,#d99a18);border-color:rgba(255,240,180,.8);box-shadow:0 5px 15px rgba(220,157,25,.3),inset 0 1px 0 rgba(255,255,255,.42);color:#fff}.multiplier-card.red{background:linear-gradient(145deg,#ff6464,#c51f3a);border-color:rgba(255,190,190,.8);box-shadow:0 5px 15px rgba(220,35,55,.3),inset 0 1px 0 rgba(255,255,255,.35);color:#fff}@media(max-width:370px){.multiplier-card{min-width:62px;padding:8px 8px;font-size:14px;border-radius:10px}.multiplier-card.one{left:3%;top:36px;bottom:auto}.multiplier-card.two{left:41%;top:17px;bottom:auto;transform:rotate(6deg)}.multiplier-card.three{left:auto;right:3%;top:68px;bottom:auto;transform:rotate(-5deg) scale(.88);min-width:76px}}
@media(min-width:520px){.bottom-nav{bottom:18px}}
@media(prefers-reduced-motion:reduce){.nav-item,.nav-icon svg,.profile-menu,.chevron{transition:none}.star-token:after{animation:none;opacity:.15;transform:translateX(0) rotate(8deg)}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.bottom-nav,.profile-menu{background:rgba(27,25,46,.97)}}

.game-hero{position:relative;isolation:isolate;width:100%;margin-left:0;height:126px;margin-top:8px;margin-right:0;margin-bottom:18px;border:1px solid rgba(255,255,255,.24);border-radius:25px;overflow:visible;background:linear-gradient(115deg,rgba(7,17,31,.26),rgba(7,17,31,.04)),url('./assets/images/background-one.png') center/cover no-repeat;box-shadow:0 12px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(255,255,255,.08);backdrop-filter:blur(22px) saturate(155%);-webkit-backdrop-filter:blur(22px) saturate(155%)}
.game-hero:before{content:"";position:absolute;inset:0;z-index:0;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.2),rgba(255,255,255,.025) 36%,rgba(20,91,171,.12) 100%);border:1px solid rgba(255,255,255,.09)}
.game-hero-copy{position:relative;z-index:2;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px 13px;max-width:66%;text-shadow:0 2px 12px rgba(0,0,0,.28)}
.game-hero-eyebrow{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.8)}
.game-hero-title{margin:0;font-size:20px;line-height:1.08;font-weight:850;letter-spacing:-.6px;color:#fff}
.game-hero-caption{font-size:11px;line-height:1.4;color:rgba(255,255,255,.82)}
.game-hero-rocket{position:absolute;z-index:3;right:3px;top:-14px;width:39%;max-width:170px;height:calc(100% + 20px);object-fit:contain;object-position:center bottom;filter:drop-shadow(0 9px 13px rgba(0,0,0,.28));pointer-events:none}
@media(max-width:370px){.game-hero{width:100%;margin-left:0;height:120px;border-radius:20px}.game-hero-copy{padding:15px 11px;max-width:68%}.game-hero-title{font-size:18px}.game-hero-caption{font-size:10px}.game-hero-rocket{right:0;width:40%;top:-12px;height:calc(100% + 18px)}}

</style>
</head>
<body>
<div class="brand-logo-wrap" aria-label="Логотип RipiUp"><img class="brand-logo" src="./assets/images/Logo-Ripi-Up.png" alt="RipiUp"></div>
<header class="top-header" aria-label="Профиль и баланс">
  <div class="profile-area">
    <button class="profile-trigger" id="profileTrigger" type="button" aria-expanded="false" aria-controls="profileMenu">
      <span class="avatar" id="headerAvatar" aria-hidden="true">?</span>
      <span class="profile-copy"><span class="profile-name" id="headerName">Гость</span><span class="profile-hint" id="headerHint">Ваш профиль</span></span>
      <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="m2 4 4 4 4-4"/></svg>
    </button>
    <button class="deposit-button" type="button" aria-label="Пополнить баланс">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H20v14H6.5A2.5 2.5 0 0 1 4 16.5z"/><path d="M4 8h16M16 12h4"/><circle cx="16" cy="12" r=".6" fill="currentColor" stroke="none"/></svg>Пополнить
    </button>
    <div class="profile-menu" id="profileMenu" role="menu" aria-label="Меню профиля">
      <div class="menu-user">
        <span class="avatar" id="menuAvatar" aria-hidden="true">?</span>
        <span class="menu-user-copy"><span class="menu-user-name" id="menuName">Гость</span><span class="menu-user-caption" id="menuUsername">Telegram Mini App</span></span>
      </div>
      <button class="menu-item" type="button" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.6.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.6-.9l-1.7.6-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.9l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.6-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.6.9l1.7-.6 1.4 2.4-1.4 1.1a7 7 0 0 1-.1 1.8Z" transform="translate(-1 -1)"/></svg>Настройки<span class="soon">Скоро</span></button>
      <button class="menu-item" type="button" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v11H9l-5 3v-14Z"/><path d="M8 9h8M8 13h5"/></svg>Поддержка<span class="soon">Скоро</span></button>
      <button class="menu-item" type="button" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16v12H4z"/><path d="m4 8 8 6 8-6"/></svg>Наш канал<span class="soon">Скоро</span></button>
    </div>
  </div>
  <div class="balance-area" aria-label="Ваш баланс: 0 звёзд">
    <span class="star-token"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.8 2.8 5.7 6.3.9-4.55 4.43 1.07 6.27L12 17.15l-5.62 2.95 1.07-6.27L2.9 9.4l6.3-.9L12 2.8Z"/></svg></span>
    <span class="balance-copy"><span class="balance-label">Ваш баланс</span><span class="balance-value">0<span class="balance-unit">⭐</span></span></span>
  </div>
</header>
<main aria-label="Главная область">
  <section class="game-hero" aria-label="Игры">
    <div class="game-hero-copy">
      <span class="game-hero-eyebrow">RipiUp • GAMES</span>
      <h1 class="game-hero-title">Время играть</h1>
      <span class="game-hero-caption">Испытай удачу и забери награды</span>
    </div>
    <img class="game-hero-rocket" src="./assets/videos/chpic.su_-_StellarRocketRO_020-ezgif.com-tgs-to-webp-converter.webp" alt="" fetchpriority="high">
    <div class="multiplier-card one" data-start="12.1" data-target="89.34" aria-label="Множитель">x12.1</div>
    <div class="multiplier-card two" data-start="27.82" data-target="54.77" aria-label="Множитель">x27.82</div>
    <div class="multiplier-card three" data-start="1.12" data-target="67.93" aria-label="Множитель">x1.12</div>
  </section>
</main>
<nav class="bottom-nav" aria-label="Основная навигация">
<button class="nav-item active" type="button" data-tab="games" aria-current="page">
<span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 8h9a4.5 4.5 0 0 1 4.35 5.65l-.8 2.75a2.3 2.3 0 0 1-3.8 1.05L13.8 15h-3.6l-2.45 2.45a2.3 2.3 0 0 1-3.8-1.05l-.8-2.75A4.5 4.5 0 0 1 7.5 8Z"/><path d="M8 10.5v4M6 12.5h4M16 11.5h.01M18 14h.01"/></svg></span><span>Игры</span></button>
<button class="nav-item" type="button" data-tab="cases"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h16v11H4z"/><path d="M3 5.5h18v4H3zM12 5.5v14"/><path d="M12 5.5C8 5.5 6.2 4.8 6.7 2.9 7.3 1 10.6 2 12 5.5Zm0 0c4 0 5.8-.7 5.3-2.6C16.7 1 13.4 2 12 5.5Z"/></svg></span><span>Кейсы</span></button>
<button class="nav-item" type="button" data-tab="earn"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2.5 5 13h6l-.5 8.5L19 10h-6l.5-7.5Z"/><path d="M4 4.5 5 6M19 17l1 1.5"/></svg></span><span>Заработок</span></button>
<button class="nav-item" type="button" data-tab="bonuses"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 14.4 8l5.3.8-3.85 3.75.9 5.3L12 15.35l-4.75 2.5.9-5.3L4.3 8.8 9.6 8 12 3.2Z"/><path d="m19.2 2 .5 1.4 1.3.5-1.3.5-.5 1.3-.5-1.3-1.3-.5 1.3-.5.5-1.4Z"/></svg></span><span>Бонусы</span></button>
</nav>
<script>
(function(){
  const trigger=document.getElementById('profileTrigger');
  const menu=document.getElementById('profileMenu');
  function setMenu(open){menu.classList.toggle('open',open);trigger.setAttribute('aria-expanded',String(open));}
  trigger.addEventListener('click',function(e){e.stopPropagation();setMenu(!menu.classList.contains('open'));});
  menu.addEventListener('click',function(e){e.stopPropagation();});
  document.addEventListener('click',function(){setMenu(false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')setMenu(false);});
  function applyTelegramUser(user){
    if(!user)return;
    const fullName=[user.first_name,user.last_name].filter(Boolean).join(' ').trim();
    const name=fullName|| (user.username?'@'+user.username:'Пользователь');
    const username=user.username?'@'+user.username:'Аккаунт Telegram';
    document.getElementById('headerName').textContent=name;
    document.getElementById('headerHint').textContent=user.username?'@'+user.username:'Ваш профиль';
    document.getElementById('menuName').textContent=name;
    document.getElementById('menuUsername').textContent=username;
    const initials=(user.first_name||user.username||'TG').trim().slice(0,1).toUpperCase();
    ['headerAvatar','menuAvatar'].forEach(function(id){
      const el=document.getElementById(id);
      el.textContent=initials;
      if(user.photo_url){
        const img=document.createElement('img');
        img.src=user.photo_url;
        img.alt='';
        img.referrerPolicy='no-referrer';
        img.onerror=function(){img.remove();el.textContent=initials;};
        el.replaceChildren(img);
      }
    });
  }
  try{
    const tg=window.Telegram&&window.Telegram.WebApp;
    if(tg){
      tg.ready();
      if(typeof tg.expand==='function')tg.expand();
      applyTelegramUser(tg.initDataUnsafe&&tg.initDataUnsafe.user);
    }
  }catch(e){}
  const multiplierCards=Array.from(document.querySelectorAll('.multiplier-card'));
  const runDuration=15000;
  const resetDuration=1000;
  function animateMultiplier(card){
    const target=Number(card.dataset.target);
    const startValue=Number(card.dataset.start||1.12);
    const started=performance.now();
    function frame(now){
      const elapsed=(now-started)%(runDuration+resetDuration);
      let value;
      if(elapsed<runDuration){
        const progress=elapsed/runDuration;
        value=startValue+(target-startValue)*Math.pow(progress,1.18);
      }else{
        const resetProgress=(elapsed-runDuration)/resetDuration;
        const eased=resetProgress*resetProgress*(3-2*resetProgress);
        value=target-(target-startValue)*eased;
      }
      card.textContent='x'+value.toFixed(2);
      card.classList.toggle('red',value>=70);
      card.classList.toggle('gold',value>=35.12&&value<70);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  multiplierCards.forEach(animateMultiplier);
  document.querySelectorAll('.nav-item').forEach(function(button){
    button.addEventListener('click',function(){
      document.querySelectorAll('.nav-item').forEach(function(item){item.classList.remove('active');item.removeAttribute('aria-current');});
      button.classList.add('active');button.setAttribute('aria-current','page');
    });
  });
})();
</script>
</body>
