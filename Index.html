<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0c18">
<title>RipiUp</title>
<style>
:root{color-scheme:dark;--bg:#0c0c18;--text:#f8f7ff;--muted:#a4a3bc;--purple:#a99aff;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{min-height:100vh;min-height:100dvh;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{min-height:100vh;min-height:100dvh;padding-bottom:calc(110px + var(--safe))}
.bottom-nav{position:fixed;z-index:30;bottom:calc(12px + var(--safe));left:50%;transform:translateX(-50%);width:min(490px,calc(100% - 28px));padding:8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;border-radius:25px;isolation:isolate;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.19),rgba(255,255,255,.055) 42%,rgba(170,158,255,.09));border:1px solid rgba(255,255,255,.24);box-shadow:0 12px 38px rgba(0,0,0,.38),0 2px 8px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(255,255,255,.07);backdrop-filter:blur(32px) saturate(185%);-webkit-backdrop-filter:blur(32px) saturate(185%)}
.bottom-nav:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.12),transparent 30%,transparent 70%,rgba(173,157,255,.1));mask-image:linear-gradient(#000,transparent 78%)}
.nav-item{position:relative;appearance:none;border:1px solid transparent;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:59px;padding:7px 2px;border-radius:18px;font:750 10px/1.2 inherit;cursor:pointer;transition:color .22s ease,background .22s ease,transform .18s ease,border-color .22s ease;outline:none}
.nav-item:focus-visible{box-shadow:0 0 0 2px rgba(190,177,255,.85)}
.nav-item:active{transform:scale(.94)}
.nav-item.active{color:#fff;background:linear-gradient(155deg,rgba(255,255,255,.22),rgba(255,255,255,.075) 55%,rgba(163,145,255,.13));border-color:rgba(255,255,255,.17);box-shadow:inset 0 1px 0 rgba(255,255,255,.27),inset 0 -1px 0 rgba(255,255,255,.05),0 3px 10px rgba(0,0,0,.08)}
.nav-icon{width:26px;height:26px;display:grid;place-items:center}
.nav-icon svg{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;transition:filter .22s ease,transform .22s ease}
.nav-item.active .nav-icon svg{filter:drop-shadow(0 0 7px rgba(174,158,255,.52));stroke:#c8bdff;transform:translateY(-1px)}
.nav-item span:last-child{white-space:nowrap}
@media(min-width:520px){.bottom-nav{bottom:18px}}
@media(prefers-reduced-motion:reduce){.nav-item,.nav-icon svg{transition:none}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.bottom-nav{background:rgba(27,25,46,.97)}}
</style>
</head>
<body>
<main aria-label="Пустая главная область"></main>
<nav class="bottom-nav" aria-label="Основная навигация">
<button class="nav-item active" type="button" data-tab="games" aria-current="page">
<span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 8h9a4.5 4.5 0 0 1 4.35 5.65l-.8 2.75a2.3 2.3 0 0 1-3.8 1.05L13.8 15h-3.6l-2.45 2.45a2.3 2.3 0 0 1-3.8-1.05l-.8-2.75A4.5 4.5 0 0 1 7.5 8Z"/><path d="M8 10.5v4M6 12.5h4M16 11.5h.01M18 14h.01"/></svg></span>
<span>Игры</span>
</button>
<button class="nav-item" type="button" data-tab="cases">
<span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h16v11H4z"/><path d="M3 5.5h18v4H3zM12 5.5v14"/><path d="M12 5.5C8 5.5 6.2 4.8 6.7 2.9 7.3 1 10.6 2 12 5.5Zm0 0c4 0 5.8-.7 5.3-2.6C16.7 1 13.4 2 12 5.5Z"/></svg></span>
<span>Кейсы</span>
</button>
<button class="nav-item" type="button" data-tab="earn">
<span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2.5 5 13h6l-.5 8.5L19 10h-6l.5-7.5Z"/><path d="M4 4.5 5 6M19 17l1 1.5"/></svg></span>
<span>Заработок</span>
</button>
<button class="nav-item" type="button" data-tab="bonuses">
<span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 14.4 8l5.3.8-3.85 3.75.9 5.3L12 15.35l-4.75 2.5.9-5.3L4.3 8.8 9.6 8 12 3.2Z"/><path d="m19.2 2 .5 1.4 1.3.5-1.3.5-.5 1.3-.5-1.3-1.3-.5 1.3-.5.5-1.4Z"/></svg></span>
<span>Бонусы</span>
</button>
</nav>
<script>
document.querySelectorAll('.nav-item').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(item => {
      item.classList.remove('active');
      item.removeAttribute('aria-current');
    });
    button.classList.add('active');
    button.setAttribute('aria-current', 'page');
  });
});
</script>
</body>
</html>
