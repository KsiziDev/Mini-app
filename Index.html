<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0c18">
<title>RipiUp</title>
<style>
:root{color-scheme:dark;--bg:#0c0c18;--text:#f8f7ff;--muted:#8583a4;--purple:#7065ff;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{min-height:100vh;min-height:100dvh;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{min-height:100vh;min-height:100dvh;padding-bottom:calc(82px + var(--safe))}
.bottom-nav{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 10px calc(9px + var(--safe));background:rgba(17,17,34,.96);backdrop-filter:blur(22px);border-top:1px solid #ffffff12;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.nav-item{appearance:none;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:54px;padding:7px 3px;border-radius:13px;font:750 10px/1.2 inherit;cursor:pointer;transition:color .18s ease,background .18s ease,transform .18s ease}
.nav-item:active{transform:scale(.96)}
.nav-item.active{color:#fff;background:linear-gradient(145deg,#7065ff30,#a54fff17);box-shadow:inset 0 0 0 1px #9387ff22}
.nav-icon{width:25px;height:25px;display:grid;place-items:center}
.nav-icon svg{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active .nav-icon svg{filter:drop-shadow(0 0 7px #8776ff66);stroke:#a99eff}
@media(min-width:520px){.bottom-nav{border:1px solid #ffffff12;border-bottom:0;border-radius:18px 18px 0 0}}
@media(prefers-reduced-motion:reduce){.nav-item{transition:none}}
</style>
</head>
<body>
<main aria-label="Пустая главная область"></main>
<nav class="bottom-nav" aria-label="Основная навигация">
<button class="nav-item active" type="button" data-tab="games" aria-current="page">
<span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 8h9a4.5 4.5 0 0 1 4.35 5.65l-.8 2.75a2.3 2.3 0 0 1-3.8 1.05L13.8 15h-3.6l-2.45 2.45a2.3 2.3 0 0 1-3.8-1.05l-.8-2.75A4.5 4.5 0 0 1 7.5 8Z"/><path d="M8 10.5v4M6 12.5h4M16 11.5h.01M18 14h.01"/></svg></span>
<span>Игры</span>
</button>
<button class="nav-item" type="button" data-tab="cases">
<span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h16v11H4z"/><path d="M3 5.5h18v4H3zM12 5.5v14"/><path d="M12 5.5C8 5.5 6.2 4.8 6.7 2.9 7.3 1 10.6 2 12 5.5Zm0 0c4 0 5.8-.7 5.3-2.6C16.7 1 13.4 2 12 5.5Z"/></svg></span>
<span>Кейсы</span>
</button>
<button class="nav-item" type="button" data-tab="earn">
<span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2.5 5 13h6l-.5 8.5L19 10h-6l.5-7.5Z"/><path d="M4 4.5 5 6M19 17l1 1.5"/></svg></span>
<span>Заработок</span>
</button>
<button class="nav-item" type="button" data-tab="bonuses">
<span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 14.4 8l5.3.8-3.85 3.75.9 5.3L12 15.35l-4.75 2.5.9-5.3L4.3 8.8 9.6 8 12 3.2Z"/><path d="m19.2 2 .5 1.4 1.3.5-1.3.5-.5 1.3-.5-1.3-1.3-.5 1.3-.5.5-1.4Z"/></svg></span>
<span>Бонусы</span>
</button>
</nav>
<script>
document.querySelectorAll('.nav-item').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(item => {
      item.classList.remove('active');
      item.removeAttribute('aria-current');
    });
    button.classList.add('active');
    button.setAttribute('aria-current', 'page');
  });
});
</script>
</body>
</html>
